name: Web workshop checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication contents
        run: python scripts/check-release.py
      - name: Configure disposable local instance
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          config = Path('web/.env.example').read_text()
          config = config.replace('replace-with-a-long-random-secret', secrets.token_urlsafe(48))
          config = config.replace('replace-with-a-long-random-password', secrets.token_urlsafe(48))
          Path('web/.env').write_text(config)
          Path('web/.env').chmod(0o600)
          PY
      - name: Build and start Compose (includes TypeScript and static HTML)
        run: docker compose -f web/compose.yaml up --build --wait --wait-timeout 180 -d
      - name: Static content, SEO and HTTP status checks
        run: python web/tests/content_http.py
      - name: PostgreSQL regressions and migration consistency
        run: |
          docker compose -f web/compose.yaml exec -T api python manage.py test stories --noinput
          docker compose -f web/compose.yaml exec -T api python manage.py makemigrations --check --dry-run
      - name: Real author, player and wiki MCP integrations
        run: |
          docker compose -f web/compose.yaml exec -T api python < web/tests/integration.py
          docker compose -f web/compose.yaml exec -T api python < web/tests/play_integration.py
          docker compose -f web/compose.yaml exec -T api python < web/tests/wiki_integration.py
      - name: Install browser test tools
        run: |
          python -m pip install -r web/backend/requirements.lock playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Browser workflows (fictional disposable accounts)
        run: |
          # Disposable CI only: suites share one IP. Reset only DRF login
          # counters between suites; keep production limits and other Redis state.
          for suite in blog_browser analytics_browser browser languages site_browser dashboard_browser onboarding_browser wiki_browser sharing_browser runtime_browser play_browser; do
            docker compose -f web/compose.yaml exec -T api python manage.py shell -c "
          from django.core.cache import cache
          from django.conf import settings
          import redis
          connection = redis.Redis.from_url(settings.CACHES['default']['LOCATION'])
          keys = list(connection.scan_iter(match=cache.make_key('throttle_login_*')))
          if keys:
              connection.delete(*keys)
          "
            python web/tests/$suite.py
          done
      - name: Stop disposable stack
        if: always()
        run: docker compose -f web/compose.yaml down -v --remove-orphans
